<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VulnScanner Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0c10 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: rgba(30, 32, 44, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 420px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
        }
        
        .step.active {
            color: #60a5fa;
        }
        
        .step.completed {
            color: #10b981;
        }
        
        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }
        
        .step.active .step-number {
            background: #60a5fa;
            border-color: #60a5fa;
            color: white;
        }
        
        .step.completed .step-number {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            background: #1e1f2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }
        
        .success-msg {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }
        
        .hidden { display: none !important; }
        
        .email-display {
            text-align: center;
            color: #60a5fa;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        
        .timer {
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            margin: 15px 0;
        }
        
        .resend-link {
            text-align: center;
            color: #60a5fa;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        
        .resend-link:hover {
            text-decoration: underline;
        }
        
        .back-link {
            text-align: center;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🛡️ VulnScanner Pro</h1>
            <p>Security Assessment Platform</p>
        </div>
        
        <div class="step-indicator">
            <div class="step active" id="step1">
                <span class="step-number">1</span>
                <span>Email</span>
            </div>
            <div class="step" id="step2">
                <span class="step-number">2</span>
                <span>Verify</span>
            </div>
        </div>
        
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        
        <!-- Step 1: Email Input -->
        <form id="emailForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="emailInput" placeholder="your@email.com" required autofocus>
            </div>
            <button type="submit" id="sendOtpBtn">Send OTP</button>
        </form>
        
        <!-- Step 2: OTP Verification -->
        <div id="otpSection" class="hidden">
            <div class="email-display" id="emailDisplay"></div>
            <p style="color: rgba(255,255,255,0.6); text-align: center; margin-bottom: 20px; font-size: 0.9rem;">
                We've sent a 6-digit code to your email
            </p>
            <form id="otpForm">
                <div class="form-group">
                    <label>Enter OTP Code</label>
                    <input type="text" id="otpInput" placeholder="000000" maxlength="6" required autofocus>
                </div>
                <div class="timer" id="otpTimer"></div>
                <button type="submit" id="verifyOtpBtn">Verify & Login</button>
            </form>
            <div class="resend-link" id="resendLink" onclick="resendOTP()">Resend OTP</div>
            <div class="back-link" onclick="goBackToEmail()">← Use different email</div>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let timerInterval = null;
        
        // Step 1: Send OTP
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('sendOtpBtn');
            
            if (!email) return;
            
            btn.disabled = true;
            btn.textContent = 'Sending OTP...';
            document.getElementById('errorMsg').style.display = 'none';
            
            try {
                const response = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentEmail = email;
                    document.getElementById('emailDisplay').textContent = email;
                    document.getElementById('emailForm').classList.add('hidden');
                    document.getElementById('otpSection').classList.remove('hidden');
                    document.getElementById('otpInput').focus();
                    
                    // Update steps
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step1').classList.add('completed');
                    document.getElementById('step2').classList.add('active');
                    
                    startTimer(300); // 5 minutes
                    
                    document.getElementById('successMsg').textContent = data.message;
                    document.getElementById('successMsg').style.display = 'block';
                    
                    // If dev mode shows OTP
                    if (data.dev_otp) {
                        console.log('DEV OTP:', data.dev_otp);
                    }
                } else {
                    document.getElementById('errorMsg').textContent = data.error;
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('errorMsg').textContent = 'Connection error. Please try again.';
                document.getElementById('errorMsg').style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send OTP';
            }
        });
        
        // Step 2: Verify OTP
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otpInput').value.trim();
            const btn = document.getElementById('verifyOtpBtn');
            
            if (!otp || otp.length !== 6) return;
            
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            document.getElementById('errorMsg').style.display = 'none';
            
            try {
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('step2').classList.remove('active');
                    document.getElementById('step2').classList.add('completed');
                    
                    document.getElementById('successMsg').textContent = 'Login successful! Redirecting...';
                    document.getElementById('successMsg').style.display = 'block';
                    
                    if (timerInterval) clearInterval(timerInterval);
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    document.getElementById('errorMsg').textContent = data.error;
                    document.getElementById('errorMsg').style.display = 'block';
                    document.getElementById('otpInput').value = '';
                    document.getElementById('otpInput').focus();
                }
            } catch (error) {
                document.getElementById('errorMsg').textContent = 'Connection error. Please try again.';
                document.getElementById('errorMsg').style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify & Login';
            }
        });
        
        function startTimer(seconds) {
            if (timerInterval) clearInterval(timerInterval);
            
            const timerEl = document.getElementById('otpTimer');
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerEl.textContent = `OTP expires in ${mins}:${secs.toString().padStart(2, '0')}`;
                
                if (seconds <= 30) {
                    timerEl.style.color = '#ef4444';
                }
                
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    timerEl.textContent = 'OTP expired. Please request a new one.';
                    document.getElementById('verifyOtpBtn').disabled = true;
                }
                
                seconds--;
            }, 1000);
        }
        
        async function resendOTP() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('resendLink').style.pointerEvents = 'none';
            document.getElementById('resendLink').style.opacity = '0.5';
            
            try {
                const response = await fetch('/api/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('successMsg').textContent = 'New OTP sent!';
                    document.getElementById('successMsg').style.display = 'block';
                    document.getElementById('otpInput').value = '';
                    document.getElementById('otpInput').focus();
                    document.getElementById('verifyOtpBtn').disabled = false;
                    startTimer(300);
                    
                    if (data.dev_otp) {
                        console.log('DEV OTP:', data.dev_otp);
                    }
                } else {
                    document.getElementById('errorMsg').textContent = data.error;
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('errorMsg').textContent = 'Connection error.';
                document.getElementById('errorMsg').style.display = 'block';
            } finally {
                document.getElementById('resendLink').style.pointerEvents = 'auto';
                document.getElementById('resendLink').style.opacity = '1';
            }
        }
        
        function goBackToEmail() {
            document.getElementById('otpSection').classList.add('hidden');
            document.getElementById('emailForm').classList.remove('hidden');
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
            
            document.getElementById('step2').classList.remove('active', 'completed');
            document.getElementById('step1').classList.remove('completed');
            document.getElementById('step1').classList.add('active');
            
            if (timerInterval) clearInterval(timerInterval);
        }
        
        // Allow only numbers in OTP input
        document.getElementById('otpInput').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
